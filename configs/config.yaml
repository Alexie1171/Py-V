model:
  # V's brain. First brain upgrade 2026-09-26: Phi-2 → IBM Granite 3B (see
  # PROJECT_STATUS.md). Chat version since Kaggle run 2 (2026-09-26): its
  # adapter (model/lora) is used only for fix / improve (v_adapter.json
  # "use_in_modes"). Plain version: ibm-granite/granite-4.1-3b-base, template,
  # adapter kept in model/lora_granite-4.1-plain.
  name: "ibm-granite/granite-4.2-3b"
  max_tokens: 512
  # How prompts reach the brain: "template" = V's "### Instruction / ### Answer"
  # templates (plain/base brains); "native_chat" = the brain's own chat format,
  # thinking off (chat versions, e.g. granite-4.2-3b). A trained adapter's own
  # setting (v_adapter.json) wins over this — the format it was trained with.
  prompt_format: "native_chat"
  # Whose tokenizer.json gives the text-splitting rules (model_loader.load_tokenizer).
  # null = the brain's own file. Set it to a brain with the same merges when the
  # brain's own file carries a wrong rule (granite-4.2-3b's has GPT-2's rule;
  # "ibm-granite/granite-4.1-3b-base" has the Granite family's). A trained
  # adapter's own setting (v_adapter.json) wins over this.
  split_rules_from: null

generation:
  # Answer settings per mode (inference/engine/generator.py); `default` covers
  # any mode not listed. Code modes must copy names and code from the prompt,
  # so no repeat penalties there — repetition_penalty 1.1 renamed functions
  # (find_Volume → find_volume) and cost 13 of 49 MBPP failures (2026-09-25).
  # temperature = how much randomness goes into word choice (0 = always the
  # likeliest word; tests pass 0 themselves).
  default:
    repetition_penalty: 1.0
    no_repeat_ngram_size: 0
    temperature: 0.2
  # Chat (2026-09-26, Granite chat): natural talk, not the safest words. No
  # repeat penalties — they also punish every word of the persona and the
  # earlier turns in the prompt. They were on against loops (a Phi-2 problem):
  # turn them back on if the chat brain starts repeating itself.
  chat:
    repetition_penalty: 1.0
    no_repeat_ngram_size: 0
    temperature: 0.7
  explain:
    repetition_penalty: 1.1
    no_repeat_ngram_size: 4
    temperature: 0.2

training:
  # Runs on Colab (train_lora_t4.py, its own T4 batch settings); batch_size and
  # gradient_accumulation are for the laptop trainer (train_lora.py).
  batch_size: 1
  gradient_accumulation: 16
  epochs: 1                # 1 pass, score, then decide on a 2nd (PROJECT_STATUS.md)
  learning_rate: 0.0002    # standard LoRA strength; 5e-5 (v1 run) barely changed the model
  warmup_steps: 20
  save_steps: 50
  eval_steps: 100
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  # Layers LoRA trains — names depend on the brain (Granite: attention + MLP;
  # Phi-2 was q/k/v_proj, dense, fc1, fc2). Change together with model.name.
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  max_seq_length: 1024     # prompt template + answer + end token; longer records are dropped, not cut.
                           # 1024 (was 768) so the long-file fix examples fit

paths:
  raw_data: "./data/raw"
  processed_data: "./data/processed"
  # Dataset v3 = v2 + long-file fix examples (build_dataset_v2.py). v2 stays at
  # ./data/datasets/v2 (Phi-2 was trained on it), v1 at ./data/datasets/*.jsonl.
  dataset: "./data/datasets/v3/train.jsonl"
  val_dataset: "./data/datasets/v3/val.jsonl"
  model_output: "./model/lora"

intent:
  # Which mode a message needs (chat / explain / generate / debug / refactor):
  # word rules first (inference/engine/controller.py, instant). A message they
  # can't place clearly — no rule matched but it is about code, two modes nearly
  # tied, or pasted code with no request — is decided by the brain
  # (inference/engine/intent_classifier.py, adapter off, one step: scores the five mode words).
  # false = word rules only. OFF since the 2026-09-26 laptop check: rules alone
  # 39/41 test messages, rules + brain also 39/41 (fixed one, broke one), and
  # 3.4 s extra per unclear message on the GTX 1650 — see PROJECT_STATUS.md section 5.
  brain_for_unclear: false

memory:
  # Phase 11 — long-term memory across all chats (memory/). SQLite file on
  # disk + a small embedding model on the CPU — never uses the GPU. Every
  # message is saved; short facts are tagged by rules; before each answer the
  # best matches go into the prompt's context slot.
  enabled: true
  db_path: "./data/memory/v_memory.db"   # private conversations — gitignored, never committed
  top_k: 5                  # facts added to a prompt (all modes)
  code_top_k: 2             # earlier code answers added (code modes only)
  max_prompt_tokens: 300    # the whole memory block — the 4 GB laptop GPU slows down past ~1,500 prompt tokens
  history_turns: 6          # recent messages of the current chat V sees in chat mode (3 exchanges, code left out — prompt_builder.chat_history); other modes don't get them
  active_code_modes: ["generate", "debug", "refactor"]   # only these get code from memory
  semantic_search: true     # meaning search (retrieval/embedder.py on CPU); false = keyword search only

rag:
  # Off since 2026-09-25: weak matches were copied into answers instead of
  # helping. Turn back on after the dataset is improved — see PROJECT_STATUS.md.
  enabled: false
  index_path: "./retrieval/index"
  top_k: 3
  # Modes that will receive RAG context injection
  # explain and chat are excluded to prevent code pattern bias
  active_modes:
    - generate
    - debug
    - refactor

dataset_v2:
  # New training set (plan: PROJECT_STATUS.md, "Next — better training data").
  # `fetch` = how many records to keep per source — more than the final mix
  # needs, so later cleaning losses don't leave gaps.
  output_dir: "./data/raw/v2"
  sample_size: 20          # --sample mode: small batch per source to check quality
  build:
    # Step 5: mix the source files into one training set (build_dataset_v2.py).
    # v3 (2026-09-26) = v2's mix + long_file_fix; v2 is kept as it was.
    output_dir: "./data/datasets/v3"
    seed: 42
    val_share: 0.05
    max_tokens: 700        # instruction + output; room left for the prompt template
    max_tokens_per_source: # exceptions to max_tokens (must stay below training.max_seq_length)
      long_file_fix: 930   # whole file in the question (+ ≤62 template + ~14 chat-format tokens ≤ 1024)
    take:                  # records per source — ~12k ≈ 40% write / 25% debug / 20% improve / 15% explain
      opencodeinstruct: 2300      # generate
      self_oss_instruct: 1700     # generate
      old_github: 800             # generate
      bug_fix: 3000               # debug
      improve_synthetic: 2000     # refactor
      commitpack_refactor: 400    # refactor — fewer exist, takes what there is
      glaive: 1100                # explain
      code_search_net: 700        # explain
      long_file_fix: 1200         # debug — bug inside a longer file, answer = fixed function only
  sources:
    opencodeinstruct:
      hf_id: "nvidia/OpenCodeInstruct"
      config: "train"
      split: "train"
      fetch: 3000
      min_test_score: 1.0  # keep only rows whose unit tests all passed
    self_oss_instruct:
      hf_id: "bigcode/self-oss-instruct-sc2-exec-filter-50k"
      config: "default"
      split: "train"
      fetch: 2000
    glaive:
      hf_id: "glaiveai/glaive-code-assistant"
      config: "default"
      split: "train"
      fetch: 1500
      min_answer_chars: 200
      min_text_share: 0.6     # answer must be at least 60% text, not code
    code_search_net:
      hf_id: "code-search-net/code_search_net"
      config: "python"
      split: "train"
      fetch: 1200
      summary_chars: [40, 400]
      min_summary_words: 6
      code_lines: [4, 40]
      max_comment_share: 0.2  # skip functions full of commented-out code
      max_per_repo: 2         # dataset is ordered by repo — force variety
    bug_fix:
      # "Fix the error" examples: breaks working OpenCodeInstruct functions on
      # purpose and records the real error. Runs code — Colab only.
      hf_id: "nvidia/OpenCodeInstruct"
      config: "train"
      split: "train"
      fetch: 3000
      min_test_score: 1.0
      max_code_lines: 25       # buggy + fixed code both go into one example
      max_tests: 5
      max_tries: 6             # bugs tried per function before giving up
      timeout_seconds: 5
      exclude_ids_from:        # rows already used by other sources
        - "./data/raw/v2/opencodeinstruct.jsonl"
    improve_synthetic:
      # "Improve this code" examples: clean OpenCodeInstruct functions rewritten
      # into clumsy-but-equivalent code (tests must still pass). Runs code —
      # Colab only.
      hf_id: "nvidia/OpenCodeInstruct"
      config: "train"
      split: "train"
      fetch: 2000
      min_test_score: 1.0
      max_code_lines: 25
      max_tests: 5
      max_rewrites: 3          # clumsy rewrites per function, each a different kind
      min_rewrites: 2          # fewer than this = too small an improvement
      max_tries: 6             # rewrites tried per function
      timeout_seconds: 5
      exclude_ids_from:
        - "./data/raw/v2/opencodeinstruct.jsonl"
        - "./data/raw/v2/bug_fix.jsonl"
    commitpack_refactor:
      # "Improve this code" examples from real refactor commits. Nothing runs.
      data_files: "hf://datasets/bigcode/commitpackft/data/python/data.jsonl"
      fetch: 800               # expected to run short (~2% of commits are refactors)
      code_lines: [3, 30]
      similarity: [0.3, 0.95]  # skip near-identical and complete rewrites
      max_per_repo: 2
    long_file_fix:
      # "Fix the bug in this file" examples: a tested function hidden among other
      # working functions, one bug planted inside it; answer = only the corrected
      # function + one line. Teaches "fix just the broken part" on long input
      # (long-question test, 2026-09-26). Runs code — Colab only.
      hf_id: "nvidia/OpenCodeInstruct"
      config: "train"
      split: "train"
      fetch: 1500
      min_test_score: 1.0
      max_code_lines: 25
      max_tests: 5
      max_tries: 6
      timeout_seconds: 5
      module_chars: [1000, 2600]   # size of the whole file (~300–800 tokens)
      warmup_functions: 30         # the first functions only fill the pool of surrounding code
      exclude_ids_from:            # target functions never repeat another source's rows
        - "./data/raw/v2/opencodeinstruct.jsonl"
        - "./data/raw/v2/bug_fix.jsonl"
        - "./data/raw/v2/improve_synthetic.jsonl"
    old_github:
      # The v1 dataset. Kept at this path; v2 will be written elsewhere.
      path: "./data/datasets/train.jsonl"
      fetch: 1100
      min_code_score: 2.5
      max_code_lines: 40      # top scores are long, project-bound functions

evaluation:
  # Scoring test: MBPP problems, each checked by running its asserts.
  # Never train on this dataset.
  dataset: "google-research-datasets/mbpp"
  config: "sanitized"
  split: "test"
  num_problems: 100
  timeout_seconds: 10
  output_dir: "./experiments/outputs"